<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner dashboard | FitForge</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/site.css" />
<style>.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.adm-side{background:#07080a;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.adm-side .logo{display:block;margin-bottom:24px}.adm-side button{display:block;width:100%;text-align:left;padding:11px 14px;background:none;border:0;color:var(--mut);font:700 .8rem system-ui;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;border-left:3px solid transparent}.adm-side button.on,.adm-side button:hover{color:var(--lime);border-left-color:var(--lime);background:var(--card)}.adm-main{padding:28px clamp(16px,3vw,36px)}.adm-main h1{font-size:2.2rem;margin-bottom:18px}
@media(max-width:900px){.adm{grid-template-columns:minmax(0,1fr)}.adm-side{position:static;height:auto;display:flex;overflow:auto;padding:10px}.adm-side .logo{display:none}.adm-side button{width:auto;white-space:nowrap}}</style>
</head>
<body>
<div class="adm">
	<aside class="adm-side"><a class="logo" href="index.html">FIT<b>FORGE</b></a><button data-v="overview" class="on">Overview</button><button data-v="members">Members</button><button data-v="checkin">Check-in desk</button><button data-v="classes">Classes</button><button data-v="leads">Leads</button><button data-v="reset">Reset demo</button><button onclick="location.href='index.html'">← Back to site</button></aside>
	<main class="adm-main" id="main"></main>
</div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
const { $, esc, inr, D, iso, pd } = FF; let view = "overview", q = "", flt = "";
const NAMES = "Aarav Mehta,Diya Nair,Kabir Singh,Meera Iyer,Rohan Gupta,Isha Verma,Vihaan Joshi,Anaya Das,Arjun Khanna,Sara Qureshi,Neel Bansal,Tara Menon,Yash Agarwal,Kiara Bose,Dhruv Rao,Ira Kulkarni,Ishaan Malik,Mira Sethi,Reyansh Jain,Zoya Ahmed,Aditya Pillai,Navya Reddy,Samar Chopra,Pari Thakur,Veer Saxena,Anvi Desai,Kavya Shah,Rudra Bhatt,Myra Sinha,Atharv Dutta".split(",");
function members() { // seeded roster + the signed-in demo member
	const plans = ["unlimited", "offpeak", "coached", "unlimited", "unlimited", "offpeak"]; let out = NAMES.map((n, i) => ({ id: "FF" + (3001 + i), name: n, plan: plans[i % plans.length], status: i % 11 === 7 ? "frozen" : i % 13 === 5 ? "expired" : "active", joined: Date.now() - (FF.hash(n) % 500) * 864e5, last: FF.hash(n) % 14 }));
	const m = FF.member.get(); if (m) out.unshift({ id: m.id, name: m.name + " (you)", plan: m.plan, status: m.status, joined: m.joined, last: 0 });
	return out;
}
const price = (p) => (D.plans.find((x) => x.id === p) || { price: 0 }).price;
const V = {
	overview() {
		const ms = members(), act = ms.filter((m) => m.status === "active"), mrr = act.reduce((s, m) => s + price(m.plan), 0);
		const week = [...Array(7)].map((_, i) => { const d = FF.addDays(new Date(), i - 6); return [FF.DAYN[d.getDay()].slice(0, 3), 150 + (FF.hash(iso(d)) % 120) + (d.getDay() % 6 === 0 ? -40 : 0)]; }), mx = Math.max(...week.map((w) => w[1]));
		const fills = Object.keys(D.programs).map((k) => ({ n: D.programs[k].name, f: 45 + (FF.hash(k) % 50) })).sort((a, b) => b.f - a.f).slice(0, 6);
		return `<h1>Overview</h1><div class="kpis"><div class="kpi"><span>Active members</span><b>${act.length}</b></div><div class="kpi"><span>Monthly recurring</span><b>${inr(mrr)}</b></div><div class="kpi"><span>Check-ins today</span><b>${40 + (FF.hash(iso(new Date())) % 50) + FF.store.get("desk", []).length}</b></div><div class="kpi"><span>Free-pass leads</span><b>${FF.leads.get().length + 12}</b></div></div>
		<div class="split" style="align-items:start;gap:20px"><div class="panel"><h3>Check-ins this week</h3><div class="bars">${week.map((w) => `<div><span>${w[1]}</span><i style="height:${w[1] / mx * 85}%"></i>${w[0]}</div>`).join("")}</div></div><div class="panel"><h3>Class fill rate</h3>${fills.map((f) => `<div style="display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:9px 0;font-size:.88rem"><span>${esc(f.n)}</span><div class="lead-bar"><i style="width:${f.f}%"></i></div><b>${f.f}%</b></div>`).join("")}</div></div>
		<div class="panel"><h3>Members by plan</h3>${["unlimited", "offpeak", "coached"].map((p) => { const c = act.filter((m) => m.plan === p).length; return `<div style="display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin:9px 0"><span>${FF.planName(p)}</span><div class="lead-bar"><i style="width:${c / act.length * 100}%"></i></div><b>${c}</b></div>`; }).join("")}</div>`;
	},
	members() {
		const ms = members().filter((m) => (!q || (m.name + m.id).toLowerCase().includes(q.toLowerCase())) && (!flt || m.status === flt));
		return `<h1>Members</h1><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px"><input class="in" id="q" placeholder="Search name or ID" value="${esc(q)}" style="max-width:260px"><div class="tabs">${["", "active", "frozen", "expired"].map((s) => `<button class="tab ${flt === s ? "on" : ""}" data-f="${s}">${s || "All"}</button>`).join("")}</div></div>
		<div style="overflow-x:auto"><table class="t"><thead><tr><th>ID</th><th>Name</th><th>Plan</th><th>Status</th><th>Joined</th><th>Last visit</th></tr></thead><tbody>${ms.slice(0, 40).map((m) => `<tr><td>${m.id}</td><td style="text-align:left"><b>${esc(m.name)}</b></td><td>${FF.planName(m.plan)}</td><td><span class="chip ${m.status === "active" ? "lime" : ""}">${m.status}</span></td><td>${new Date(m.joined).toLocaleDateString("en-IN", { month: "short", year: "numeric" })}</td><td>${m.last ? m.last + " d ago" : "Today"}</td></tr>`).join("") || '<tr><td colspan="6" class="msg">No members match.</td></tr>'}</tbody></table></div>`;
	},
	checkin() {
		const log = FF.store.get("desk", []).slice().reverse();
		return `<h1>Check-in desk</h1><div class="split" style="align-items:start;gap:20px"><form class="panel" id="ci"><h3>Scan or type a member ID</h3><div style="display:flex;gap:10px"><input class="in" id="mid" placeholder="e.g. FF3004" required style="text-transform:uppercase"><button class="btn">Check in</button></div><p class="msg" style="margin-top:10px" id="cr">The turnstile validates plan status and class bookings.</p></form><div class="panel"><h3>Recent check-ins</h3>${log.length ? `<table class="t"><tbody>${log.slice(0, 10).map((l) => `<tr><td><b>${esc(l.name)}</b></td><td>${l.id}</td><td class="msg">${new Date(l.ts).toLocaleTimeString("en-IN", { timeStyle: "short" })}</td></tr>`).join("")}</tbody></table>` : '<p class="msg">No check-ins yet today.</p>'}</div></div>`;
	},
	classes() {
		const o = FF.store.get("over", {}), cn = o.cancelled || {};
		const today = FF.sessionsOn(new Date());
		return `<h1>Classes</h1><div class="panel"><h3>Capacity per programme</h3><table class="t"><thead><tr><th>Programme</th><th>Coach</th><th>Capacity</th></tr></thead><tbody>${Object.keys(D.programs).map((k) => `<tr><td style="text-align:left"><b>${esc(D.programs[k].name)}</b></td><td>${esc(D.coaches[D.programs[k].coach].name)}</td><td><input class="in" type="number" min="4" max="40" value="${FF.prog(k).cap}" data-cap="${k}" style="width:80px;padding:6px"></td></tr>`).join("")}</tbody></table></div>
		<div class="panel"><h3>Today's sessions</h3><table class="t"><tbody>${today.map((s) => `<tr><td>${s.time}</td><td style="text-align:left"><b>${esc(s.p.name)}</b></td><td>${s.taken}/${s.p.cap}</td><td><button class="btn ghost sm" data-cx="${s.id}">${cn[s.id] ? "Reinstate" : "Cancel session"}</button></td></tr>`).join("") || '<tr><td class="msg">No sessions today.</td></tr>'}</tbody></table></div>`;
	},
	leads() {
		const l = FF.leads.get().slice().reverse(), i = FF.store.get("intros", []).slice().reverse();
		return `<h1>Leads</h1><div class="panel"><h3>Free-pass &amp; membership sign-ups</h3>${l.length ? `<table class="t"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Plan</th></tr></thead><tbody>${l.map((x) => `<tr><td>${x.id}</td><td style="text-align:left">${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${FF.planName(x.plan)}</td></tr>`).join("")}</tbody></table>` : '<p class="msg">Sign-ups made on the public site appear here.</p>'}</div>
		<div class="panel"><h3>Intro-session requests</h3>${i.length ? `<table class="t"><thead><tr><th>Name</th><th>Coach</th><th>Date</th><th>Goal</th></tr></thead><tbody>${i.map((x) => `<tr><td style="text-align:left">${esc(x.name)}</td><td>${esc(D.coaches[x.coach].name)}</td><td>${x.date}</td><td>${esc(x.goal)}</td></tr>`).join("")}</tbody></table>` : '<p class="msg">Requests from the Coaches page appear here.</p>'}</div>`;
	},
};
function draw() { $("#main").innerHTML = V[view](); document.querySelectorAll(".adm-side [data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === view)); }
document.addEventListener("click", (e) => {
	const b = e.target.closest("button"); if (!b) return;
	if (b.dataset.v === "reset") { if (b.dataset.sure) { Object.keys(localStorage).filter((k) => k.startsWith("ff-")).forEach((k) => localStorage.removeItem(k)); location.reload(); } else { b.dataset.sure = 1; b.textContent = "Tap again to confirm"; } }
	else if (b.dataset.v) { view = b.dataset.v; draw(); }
	else if (b.dataset.f !== undefined) { flt = b.dataset.f; draw(); }
	else if (b.dataset.cx) { const o = FF.store.get("over", {}); o.cancelled = o.cancelled || {}; if (o.cancelled[b.dataset.cx]) delete o.cancelled[b.dataset.cx]; else o.cancelled[b.dataset.cx] = true; FF.store.set("over", o); draw(); }
});
document.addEventListener("input", (e) => { const t = e.target;
	if (t.id === "q") { q = t.value; const pos = t.selectionStart; draw(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }
	else if (t.dataset.cap) { const o = FF.store.get("over", {}); o[t.dataset.cap] = { ...(o[t.dataset.cap] || {}), cap: +t.value || 4 }; FF.store.set("over", o); } });
document.addEventListener("submit", (e) => { if (e.target.id !== "ci") return; e.preventDefault(); const id = $("#mid").value.trim().toUpperCase(), m = members().find((x) => x.id === id), r = $("#cr");
	if (!m) { r.className = "msg err"; r.textContent = "No member with that ID."; return; }
	if (m.status !== "active") { r.className = "msg err"; r.textContent = m.name + ", membership is " + m.status + ". Entry denied."; return; }
	const l = FF.store.get("desk", []); l.push({ id, name: m.name.replace(" (you)", ""), ts: Date.now() }); FF.store.set("desk", l);
	const cur = FF.member.get(); if (cur && cur.id === id) { const c = FF.store.get("checkins", []); if (!c.includes(iso(new Date()))) { c.push(iso(new Date())); FF.store.set("checkins", c); } }
	draw(); $("#cr").className = "msg ok"; $("#cr").textContent = "✓ " + m.name + " checked in."; });
draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
