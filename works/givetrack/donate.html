<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donate | GiveTrack (demo)</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../lib/app.css" />
<style>
:root{--acc:#d97706;--acc-ink:#fff;--acc-soft:rgba(217,119,6,.12);--bg:#fffaf2}body{background:#f7ead6}
.w{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(120,70,0,.14)}
.hero{background:linear-gradient(160deg,#b45309,#d97706);color:#fff;padding:26px 22px}.hero h1{font-size:1.5rem}.hero p{opacity:.92;margin-top:6px}
.pc{padding:18px;display:grid;gap:16px}.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.amts button{padding:14px 4px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:800;font-size:1rem}.amts button.on{border-color:var(--acc);background:var(--acc-soft);color:#92400e}
.cm{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;display:block}.cm.on{border-color:var(--acc);background:var(--acc-soft)}
</style>
</head>
<body>
<div class="w"><div class="hero"><small id="sn" style="opacity:.85"></small><h1>Every rupee reaches a child</h1><p>Give once or every month. You get an 80G receipt by WhatsApp straight away.</p></div><div class="pc" id="pc"></div></div>
<script src="../lib/ui.js"></script>
<script src="../lib/ui2.js"></script>
<script src="../lib/qrcode.min.js"></script>
<script src="js/core.js"></script>
<script>
(function () {
	const { $, $$, esc, inr, toast, modal, field } = UI, { S } = GT; $("#sn").textContent = GT.settings().name;
	let st = { camp: new URLSearchParams(location.search).get("c") || GT.camps()[0].id, amt: 1000, freq: "once", done: null };
	function draw() {
		if (st.done) { const d = st.done; return ($("#pc").innerHTML = `<div class="card" style="text-align:center;padding:28px"><div style="font-size:2.6rem;color:var(--acc)">✓</div><h2>Thank you, ${esc(GT.donor(d.donor).name.split(" ")[0])}</h2><p class="mut" style="margin:8px 0 14px">Your gift of ${inr(d.amt)} to ${esc(GT.camp(d.camp).name)} has been recorded. Receipt ${d.rcpt}.</p><div class="row" style="justify-content:center"><button class="btn pri" id="rc">View 80G receipt</button><button class="btn" id="ag">Give again</button></div></div>`, ($("#rc").onclick = () => modal({ title: "80G receipt", wide: true, body: GT.receiptHTML(d), actions: [{ label: "Close" }, { label: "Print", cls: "pri", fn: () => { UI.print(GT.receiptHTML(d), d.rcpt); return false; } }] })), ($("#ag").onclick = () => { st.done = null; draw(); })); }
		$("#pc").innerHTML = `<div><h3 style="margin-bottom:8px">Choose a cause</h3>${GT.camps().map((c) => { const r = GT.raised(c.id); return `<label class="cm ${c.id === st.camp ? "on" : ""}" style="margin-bottom:8px"><input type="radio" name="cm" value="${c.id}" ${c.id === st.camp ? "checked" : ""} hidden><div class="row sb"><b>${esc(c.name)}</b><span class="mut">${Math.round((r / c.goal) * 100)}%</span></div><div class="mut" style="font-size:.84rem">${esc(c.desc)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100, (r / c.goal) * 100)}%"></i></div></label>`; }).join("")}</div>
		<div><h3 style="margin-bottom:8px">Amount</h3><div class="amts">${[500, 1000, 2500, 5000, 10000, 25000].map((a) => `<button data-a="${a}" class="${st.amt === a ? "on" : ""}">${inr(a)}</button>`).join("")}</div><input class="in" id="ca" type="number" placeholder="Or enter another amount" style="margin-top:8px"></div>
		<div class="tabs" id="fq" style="width:100%"><button data-f="once" class="${st.freq === "once" ? "on" : ""}" style="flex:1">One time</button><button data-f="monthly" class="${st.freq === "monthly" ? "on" : ""}" style="flex:1">Every month</button></div>
		<div class="card"><div class="stack">${field("Your name", "n", "", { req: 1 })}<div class="row2">${field("Mobile", "p", "", { type: "tel", req: 1 })}${field("Email", "e", "", { type: "email" })}</div>${field("PAN (needed for the 80G deduction)", "pan", "")}</div></div>
		<button class="btn pri" id="pay" style="padding:15px;font-size:1.05rem">Give ${inr(st.amt)}${st.freq === "monthly" ? " every month" : ""}</button><p class="mut" style="font-size:.8rem;text-align:center">Demo only, no payment is taken. ${esc(GT.settings().name)} is a fictional charity.</p>`;
		$$("[name=cm]").forEach((r) => (r.onchange = () => { st.camp = r.value; draw(); })); $$("[data-a]").forEach((b) => (b.onclick = () => { st.amt = +b.dataset.a; draw(); })); $("#ca").oninput = (e) => { st.amt = +e.target.value || 0; $("#pay").textContent = "Give " + inr(st.amt) + (st.freq === "monthly" ? " every month" : ""); };
		$$("[data-f]").forEach((b) => (b.onclick = () => { st.freq = b.dataset.f; draw(); }));
		$("#pay").onclick = () => { const n = $("[name=n]").value.trim(), p = $("[name=p]").value.trim(); if (!n || p.length < 10 || st.amt < 100) return toast("Please add your name, a 10 digit mobile and an amount of at least ₹100"); const link = UI.upi(GT.settings().upi, GT.settings().name, st.amt, "Donation"); modal({ title: "Pay " + inr(st.amt), body: `<div style="text-align:center"><div id="qrp" style="display:inline-block;background:#fff;padding:10px;border-radius:10px"></div><p class="mut" style="margin:10px 0">Scan with any UPI app, or tap below on your phone.</p><a class="btn" href="${link}">Open UPI app</a></div>`, onOpen: () => UI.qr("#qrp", link, 170), actions: [{ label: "Back" }, { label: "I have paid", cls: "pri", fn: () => { const L = GT.donors(); let dn = L.find((x) => x.phone === p); if (!dn) { dn = { id: "d" + Date.now(), name: n, phone: p, email: $("[name=e]").value, pan: $("[name=pan]").value, city: "", type: "Individual", note: "" }; L.push(dn); S.set("donors", L); } else if (!dn.pan && $("[name=pan]").value) { dn.pan = $("[name=pan]").value; S.set("donors", L); } const d = GT.add({ donor: dn.id, amt: st.amt, mode: "UPI", camp: st.camp, src: "Website", recurring: st.freq === "monthly" }); if (st.freq === "monthly") { const R = S.get("recur", []); R.push({ id: "r" + Date.now(), donor: dn.id, amt: st.amt, camp: st.camp, day: new Date().getDate(), since: UI.today(), status: "active" }); S.set("recur", R); } st.done = d; draw(); } }] }); };
	}
	draw();
})();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
