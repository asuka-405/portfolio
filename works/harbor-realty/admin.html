<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent CRM | Harbor &amp; Co.</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/site.css" />
<style>.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.adm-side{background:var(--navy);color:#c9d3e6;padding:22px 14px;position:sticky;top:0;height:100vh}.adm-side .logo{display:block;margin-bottom:24px}.adm-side button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;background:none;border:0;color:#c9d3e6;font:600 .94rem system-ui;cursor:pointer;margin-bottom:3px}.adm-side button.on,.adm-side button:hover{background:rgba(255,255,255,.1);color:#fff}.adm-main{min-width:0;padding:26px clamp(16px,3vw,36px)}.adm-main h1{font-size:1.8rem;margin-bottom:16px}
@media(max-width:900px){.adm{grid-template-columns:minmax(0,1fr)}.adm-side{position:static;height:auto;display:flex;overflow:auto;padding:10px}.adm-side .logo{display:none}.adm-side button{width:auto;white-space:nowrap}}</style>
</head>
<body>
<div class="adm">
	<aside class="adm-side"><a class="logo" href="index.html">Harbor<b>&amp;</b>Co.</a><button data-v="leads" class="on">📥 Leads</button><button data-v="visits">📅 Site visits</button><button data-v="listings">🏠 Listings</button><button data-v="analytics">📈 Analytics</button><button data-v="reset">↺ Reset demo</button><button onclick="location.href='index.html'">← Back to site</button></aside>
	<main class="adm-main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
const { $, $$, esc, inr, img, D } = HR; let view = "leads", agent = "";
const STAGES = [["new", "New"], ["contacted", "Contacted"], ["visit", "Visit booked"], ["negotiation", "Negotiation"], ["closed", "Closed"]];
function seedLeads() {
	if (HR.store.get("seeded", false)) return; const now = Date.now(), L = HR.listings();
	const S = [["Aditi Sharma", "p1", "visit", "contacted"], ["Rohan Bajaj", "p2", "callback", "negotiation"], ["Neha Kapoor", "p4", "visit", "visit"], ["Sameer Khan", "p8", "callback", "new"], ["Priya Nair", "p3", "visit", "closed"], ["Vikas Gupta", "p5", "callback", "contacted"], ["Tanya Mehra", "r1", "visit", "new"], ["Arjun Rao", "p11", "callback", "negotiation"]];
	const leads = S.map((s, i) => ({ id: "LD-" + (400 + i), ts: now - (i + 1) * 3 * 36e5, name: s[0], phone: "98" + (10000000 + HR.hash(s[0]) % 80000000), prop: s[1], kind: s[2], stage: s[3], agent: (HR.get(s[1]) || {}).agent, seed: true, visit: s[2] === "visit" ? HR.iso(HR.addDays(new Date(), i % 5 + 1)) + " 1" + (i % 6) + ":00" : "" }));
	HR.store.set("leads", [...leads, ...HR.leads.get()]); HR.store.set("seeded", true);
}
const V = {
	leads() {
		const all = HR.leads.get().filter((l) => !agent || l.agent === agent), won = all.filter((l) => l.stage === "closed").length;
		return `<h1>Leads</h1><div class="kpis"><div class="kpi"><span>Total leads</span><b>${all.length}</b></div><div class="kpi"><span>New today</span><b>${all.filter((l) => l.stage === "new").length}</b></div><div class="kpi"><span>In negotiation</span><b>${all.filter((l) => l.stage === "negotiation").length}</b></div><div class="kpi"><span>Conversion</span><b>${all.length ? Math.round(won / all.length * 100) : 0}%</b></div></div>
		<div class="tabs" style="margin-bottom:14px"><button class="tab ${agent === "" ? "on" : ""}" data-a="">All agents</button>${Object.entries(D.agents).map(([k, a]) => `<button class="tab ${agent === k ? "on" : ""}" data-a="${k}">${a.name.split(" ")[0]}</button>`).join("")}</div>
		<div class="kan">${STAGES.map(([k, n]) => `<div class="col"><h4><span>${n}</span><span>${all.filter((l) => l.stage === k).length}</span></h4>${all.filter((l) => l.stage === k).sort((a, b) => b.ts - a.ts).map((l) => { const p = l.prop && HR.get(l.prop); return `<div class="lead"><b>${esc(l.name)}</b><span class="msg">${esc(l.phone)}</span><div style="margin:4px 0">${p ? esc(p.title) : "General enquiry"}</div><span class="chip">${l.kind}</span>${l.note ? `<div class="msg" style="margin-top:4px">${esc(l.note)}</div>` : ""}${l.visit ? `<div class="msg">📅 ${esc(l.visit)}</div>` : ""}<select class="in" data-mv="${l.id}" style="margin-top:8px;padding:6px 8px;font-size:.8rem">${STAGES.map(([s, nn]) => `<option value="${s}" ${l.stage === s ? "selected" : ""}>${nn}</option>`).join("")}</select></div>`; }).join("") || '<p class="msg">-</p>'}</div>`).join("")}</div>`;
	},
	visits() {
		const v = HR.store.get("visits", []).map((x) => ({ ...x })), seeded = HR.leads.get().filter((l) => l.kind === "visit" && l.visit).map((l) => ({ prop: l.prop, date: l.visit.split(" ")[0], time: l.visit.split(" ")[1], name: l.name })), all = [...seeded, ...v].sort((a, b) => (a.date + a.time < b.date + b.time ? -1 : 1));
		return `<h1>Site visits</h1><table class="t"><thead><tr><th>When</th><th>Property</th><th>Visitor</th><th>Agent</th></tr></thead><tbody>${all.map((x) => { const p = HR.get(x.prop) || {}; return `<tr><td><b>${HR.pd(x.date).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })}</b> · ${esc(x.time || "")}</td><td>${esc(p.title || "-")}<div class="msg">${esc(p.loc || "")}</div></td><td>${esc(x.name)}</td><td>${p.agent ? esc(D.agents[p.agent].name) : "-"}</td></tr>`; }).join("") || '<tr><td colspan="4" class="msg">No visits scheduled.</td></tr>'}</tbody></table>`;
	},
	listings() {
		return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1>Listings</h1><button class="btn gold sm" data-add>+ Add listing</button></div><div style="overflow-x:auto"><table class="t"><thead><tr><th></th><th>Property</th><th>Price</th><th>Views</th><th>Featured</th><th>Status</th></tr></thead><tbody>${HR.listings().map((l) => `<tr><td><img src="${img(l.imgs[0])}" alt="" style="width:64px;height:48px;border-radius:8px;object-fit:cover"></td><td><b>${esc(l.title)}</b><div class="msg">${esc(l.loc)}, ${esc(l.city)} · ${l.purpose}</div></td><td><input class="in" type="number" data-pr="${l.id}" value="${l.price}" style="width:110px;padding:6px 8px"><div class="msg">${l.purpose === "rent" ? "₹/month" : "lakh"}</div></td><td>${HR.viewCount(l)}</td><td><input type="checkbox" data-ft="${l.id}" ${l.featured ? "checked" : ""}></td><td><select class="in" data-st="${l.id}" style="padding:6px 8px"><option value="active" ${l.status !== "sold" ? "selected" : ""}>Active</option><option value="sold" ${l.status === "sold" ? "selected" : ""}>Sold / let</option></select></td></tr>`).join("")}</tbody></table></div>`;
	},
	analytics() {
		const L = HR.listings().map((l) => ({ l, v: HR.viewCount(l) })).sort((a, b) => b.v - a.v).slice(0, 8), mx = L[0].v, leads = HR.leads.get(), kinds = {}; leads.forEach((l) => { kinds[l.kind] = (kinds[l.kind] || 0) + 1; });
		const fun = [["Views", L.reduce((s, x) => s + x.v, 0)], ["Enquiries", leads.length * 12], ["Site visits", leads.filter((l) => ["visit", "negotiation", "closed"].includes(l.stage)).length * 3], ["Deals", leads.filter((l) => l.stage === "closed").length]];
		return `<h1>Analytics</h1><div class="split" style="align-items:start;gap:20px"><div class="panel"><h3>Most-viewed listings</h3>${L.map((x) => `<div style="display:grid;grid-template-columns:170px 1fr 50px;gap:10px;align-items:center;margin:9px 0;font-size:.88rem"><span>${esc(x.l.title)}</span><div style="height:10px;background:var(--line);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${x.v / mx * 100}%;background:var(--gold)"></i></div><b>${x.v}</b></div>`).join("")}</div>
		<div><div class="panel"><h3>Funnel</h3>${fun.map(([k, v], i) => `<div style="display:grid;grid-template-columns:100px 1fr 60px;gap:10px;align-items:center;margin:9px 0"><span>${k}</span><div style="height:18px;background:var(--navy);width:${Math.max(6, v / fun[0][1] * 100)}%;border-radius:6px"></div><b>${v}</b></div>`).join("")}</div><div class="panel"><h3>Lead sources</h3>${Object.entries(kinds).map(([k, v]) => `<div style="display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0"><span style="text-transform:capitalize">${k}</span><b>${v}</b></div>`).join("")}</div></div></div>`;
	},
};
function addModal() {
	$("#mbox").innerHTML = `<h3 style="font-size:1.4rem;margin-bottom:12px">Add a listing</h3><form id="af" style="display:grid;gap:12px"><label class="f">Title<input class="in" name="title" required></label><div class="row2"><label class="f">City<input class="in" name="city" required value="Noida"></label><label class="f">Locality<input class="in" name="loc" required></label></div><div class="row3"><label class="f">Type<select class="in" name="type"><option>Apartment</option><option>Villa</option><option>Plot</option><option>Commercial</option></select></label><label class="f">Purpose<select class="in" name="purpose"><option value="sale">Sale</option><option value="rent">Rent</option></select></label><label class="f">Price (₹ lakh / ₹ per month)<input class="in" type="number" name="price" required></label></div><div class="row3"><label class="f">Beds<input class="in" type="number" name="beds" value="2"></label><label class="f">Baths<input class="in" type="number" name="baths" value="2"></label><label class="f">Area (sq ft)<input class="in" type="number" name="area" value="1200" required></label></div><label class="f">Photo<select class="in" name="img">${["apt1", "apt2", "apt3", "villa1", "villa2", "villa3", "plot1", "plot3", "office1", "studio1"].map((k) => `<option>${k}</option>`).join("")}</select></label><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" data-mx>Cancel</button><button class="btn gold">Publish</button></div></form>`;
	$("#modal").classList.add("on");
	$("#af").onsubmit = (e) => { e.preventDefault(); const f = e.target, c = HR.store.get("custom", []); c.push({ id: "n" + (c.length + 1), title: f.title.value, city: f.city.value, loc: f.loc.value, type: f.type.value, purpose: f.purpose.value, price: +f.price.value, beds: +f.beds.value, baths: +f.baths.value, area: +f.area.value, floor: "-", age: "New listing", furn: "-", facing: "-", agent: "kavya", imgs: [f.img.value, "liv1", "kit1"], desc: "Newly listed property. Details to be updated by the listing agent.", am: ["Lift", "Power backup", "24×7 security"] }); HR.store.set("custom", c); $("#modal").classList.remove("on"); HR.toast("Listing published"); draw(); };
}
function draw() { $("#main").innerHTML = V[view](); $$(".adm-side [data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === view)); }
document.addEventListener("click", (e) => {
	const b = e.target.closest("button"); if (!b) { if (e.target.id === "modal") $("#modal").classList.remove("on"); return; }
	if (b.dataset.v === "reset") { if (b.dataset.sure) { Object.keys(localStorage).filter((k) => k.startsWith("hr-")).forEach((k) => localStorage.removeItem(k)); location.reload(); } else { b.dataset.sure = 1; b.textContent = "Tap again to confirm"; } }
	else if (b.dataset.v) { view = b.dataset.v; draw(); } else if (b.dataset.a !== undefined) { agent = b.dataset.a; draw(); }
	else if ("add" in b.dataset) addModal(); else if ("mx" in b.dataset) $("#modal").classList.remove("on");
});
document.addEventListener("change", (e) => { const t = e.target, o = HR.store.get("over", {});
	if (t.dataset.mv) { const l = HR.leads.get(); l.find((x) => x.id === t.dataset.mv).stage = t.value; HR.leads.save(l); draw(); }
	else if (t.dataset.pr) { o[t.dataset.pr] = { ...(o[t.dataset.pr] || {}), price: +t.value }; HR.store.set("over", o); HR.toast("Price updated"); }
	else if (t.dataset.ft) { o[t.dataset.ft] = { ...(o[t.dataset.ft] || {}), featured: t.checked }; HR.store.set("over", o); HR.toast("Featured updated"); }
	else if (t.dataset.st) { o[t.dataset.st] = { ...(o[t.dataset.st] || {}), status: t.value }; HR.store.set("over", o); HR.toast("Status updated"); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#modal").classList.remove("on"); });
seedLeads(); draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
