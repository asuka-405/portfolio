<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home-loan, affordability &amp; stamp-duty calculators | Harbor &amp; Co.</title>
<meta name="description" content="EMI, affordability, stamp duty and rent-vs-buy calculators for buying a home in Delhi NCR." />
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><p class="eyebrow" style="color:var(--gold)">Calculators</p><h1>Run the numbers first.</h1><p>Four tools to understand what you can borrow, what you'll pay each month and what it really costs to buy.</p></div></section>
<section class="sec" style="padding-top:28px"><div class="wrap">
	<div class="tabs" id="tabs" style="margin-bottom:22px"><button class="tab on" data-t="emi">EMI</button><button class="tab" data-t="aff">Affordability</button><button class="tab" data-t="duty" id="duty">Stamp duty</button><button class="tab" data-t="rvb">Rent vs buy</button></div>
	<div class="layout" style="grid-template-columns:1fr 1fr"><div class="panel" id="in"></div><div class="panel" id="out" style="position:sticky;top:84px"></div></div>
</div></section>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
HR.layout("emi");
const { $, inr } = HR; let tab = location.hash === "#duty" ? "duty" : "emi";
const sl = (id, l, min, max, step, v, f = (x) => x) => `<label class="f" style="margin-bottom:14px"><span style="display:flex;justify-content:space-between">${l}<b id="${id}v" style="color:var(--navy)"></b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" style="accent-color:var(--gold);width:100%"></label>`;
const v = (id) => +document.getElementById(id).value, L = (x) => HR.fmtLakh(x);
const FM = { price: (x) => L(x), dp: (x) => x + "%", rate: (x) => x + "%", yrs: (x) => x + " yrs", inc: (x) => inr(x), emis: (x) => inr(x), rent: (x) => inr(x), growth: (x) => x + "%", ret: (x) => x + "%", stay: (x) => x + " yrs" };
const UI = {
	emi: () => `<h3>Home-loan EMI</h3>${sl("price", "Property price", 20, 600, 5, 150)}${sl("dp", "Down payment", 10, 60, 5, 20)}${sl("rate", "Interest rate", 6.5, 12, 0.1, 8.5)}${sl("yrs", "Tenure", 5, 30, 1, 20)}`,
	aff: () => `<h3>How much can you afford?</h3>${sl("inc", "Monthly take-home income", 30000, 600000, 5000, 120000)}${sl("emis", "Existing EMIs / month", 0, 150000, 1000, 10000)}${sl("rate", "Interest rate", 6.5, 12, 0.1, 8.5)}${sl("yrs", "Tenure", 5, 30, 1, 20)}${sl("dp", "Down payment you can make", 10, 60, 5, 20)}`,
	duty: () => `<h3>Stamp duty &amp; registration</h3>${sl("price", "Property price", 20, 600, 5, 150)}<label class="f" style="margin-bottom:14px">State<select class="in" id="state"><option value="up">Uttar Pradesh (Noida, Ghaziabad)</option><option value="hr">Haryana (Gurugram)</option><option value="dl">Delhi</option></select></label><label class="f">Buyer<select class="in" id="buyer"><option value="m">Male</option><option value="f">Female</option><option value="j">Joint</option></select></label>`,
	rvb: () => `<h3>Rent vs buy</h3>${sl("price", "Property price", 20, 600, 5, 120)}${sl("rent", "Monthly rent for a similar home", 10000, 200000, 1000, 35000)}${sl("rate", "Loan interest rate", 6.5, 12, 0.1, 8.5)}${sl("growth", "Property appreciation / yr", 0, 12, 0.5, 6)}${sl("ret", "Return on invested savings / yr", 4, 14, 0.5, 8)}${sl("stay", "How long you'll stay", 3, 20, 1, 10)}`,
};
const CALC = {
	emi() { const P = v("price") * 1e5 * (1 - v("dp") / 100), e = HR.emi(P, v("rate"), v("yrs")), tot = e * v("yrs") * 12, int = tot - P, pct = Math.round(int / tot * 100);
		return `<p class="eyebrow">Monthly EMI</p><div class="pr" style="font-size:2.6rem;margin:4px 0 14px">${inr(e)}</div><div style="height:14px;border-radius:9px;overflow:hidden;display:flex;margin-bottom:12px"><i style="width:${100 - pct}%;background:var(--navy)"></i><i style="width:${pct}%;background:var(--gold)"></i></div><div style="display:grid;gap:8px"><div class="row2"><span class="msg">Loan amount</span><b>${inr(P)}</b></div><div class="row2"><span class="msg">Total interest (${pct}%)</span><b>${inr(int)}</b></div><div class="row2"><span class="msg">Total payable</span><b>${inr(tot)}</b></div><div class="row2"><span class="msg">Down payment</span><b>${inr(v("price") * 1e5 * v("dp") / 100)}</b></div></div>`; },
	aff() { const maxE = Math.max(0, v("inc") * 0.5 - v("emis")), r = v("rate") / 1200, n = v("yrs") * 12, P = r ? maxE * (Math.pow(1 + r, n) - 1) / (r * Math.pow(1 + r, n)) : maxE * n, price = P / (1 - v("dp") / 100);
		return `<p class="eyebrow">You can afford up to</p><div class="pr" style="font-size:2.6rem;margin:4px 0 8px">${L(Math.round(price / 1e5))}</div><p class="msg" style="margin-bottom:14px">Banks typically cap total EMIs at 50% of take-home income.</p><div style="display:grid;gap:8px"><div class="row2"><span class="msg">Eligible loan</span><b>${inr(P)}</b></div><div class="row2"><span class="msg">Max EMI you can service</span><b>${inr(maxE)}</b></div><div class="row2"><span class="msg">Down payment needed</span><b>${inr(price * v("dp") / 100)}</b></div></div><a class="btn gold block" style="margin-top:16px" href="listings.html?max=${Math.min(500, Math.round(price / 1e5 / 10) * 10)}">See homes in your budget</a>`; },
	duty() { const pr = v("price") * 1e5, s = document.getElementById("state").value, b = document.getElementById("buyer").value;
		const R = { up: { m: 7, f: 6, j: 7 }, hr: { m: 7, f: 5, j: 6 }, dl: { m: 6, f: 4, j: 5 } }[s][b], sd = pr * R / 100, reg = Math.min(pr * 0.01, s === "up" ? 1e9 : 1e9), tot = sd + reg;
		return `<p class="eyebrow">Total government charges</p><div class="pr" style="font-size:2.6rem;margin:4px 0 14px">${inr(tot)}</div><div style="display:grid;gap:8px"><div class="row2"><span class="msg">Stamp duty (${R}%)</span><b>${inr(sd)}</b></div><div class="row2"><span class="msg">Registration (1%)</span><b>${inr(reg)}</b></div><div class="row2"><span class="msg">All-in cost</span><b>${inr(pr + tot)}</b></div></div><p class="msg" style="margin-top:12px">Indicative rates for residential property; they change often and vary by circle and buyer. Confirm with a sub-registrar.</p>`; },
	rvb() { const P = v("price") * 1e5, dp = P * 0.2, loan = P - dp, e = HR.emi(loan, v("rate"), 20), yrs = v("stay"), g = v("growth") / 100, ret = v("ret") / 100, r = v("rent");
		let rentCost = 0, rent = r, sav = dp, bal = loan; const mr = v("rate") / 1200;
		for (let m = 1; m <= yrs * 12; m++) { sav *= 1 + ret / 12; if (m % 12 === 0) rent *= 1.06; rentCost += rent; sav += Math.max(0, e - rent); }
		for (let m = 1; m <= yrs * 12; m++) bal = bal * (1 + mr) - e;
		const value = P * Math.pow(1 + g, yrs), equity = value - Math.max(0, bal), net = equity - sav;
		return `<p class="eyebrow">After ${yrs} years</p><div class="pr" style="font-size:2.1rem;margin:4px 0 8px">${net > 0 ? "Buying" : "Renting"} comes out ahead</div><p class="msg" style="margin-bottom:14px">by about <b>${inr(Math.abs(net))}</b> (assuming you invest the difference when renting).</p><div style="display:grid;gap:8px"><div class="row2"><span class="msg">Home value</span><b>${inr(value)}</b></div><div class="row2"><span class="msg">Your equity (after loan)</span><b>${inr(equity)}</b></div><div class="row2"><span class="msg">Renter's investment pot</span><b>${inr(sav)}</b></div><div class="row2"><span class="msg">Monthly EMI vs rent</span><b>${inr(e)} vs ${inr(r)}</b></div></div>`; },
};
function draw(keep) { if (!keep) $("#in").innerHTML = UI[tab](); Object.keys(FM).forEach((k) => { const e = document.getElementById(k), o = document.getElementById(k + "v"); if (e && o) o.textContent = FM[k](+e.value); }); $("#out").innerHTML = CALC[tab](); document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.toggle("on", b.dataset.t === tab)); }
$("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) { tab = b.dataset.t; history.replaceState(null, "", "#" + (tab === "duty" ? "duty" : "")); draw(); } };
$("#in").addEventListener("input", () => draw(true)); draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
