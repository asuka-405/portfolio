<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smile quiz | Lumen Dental</title>
<meta name="description" content="Five quick questions to find the right dental treatment for you, with estimated costs." />
<link rel="stylesheet" href="css/site.css" />
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><p class="eyebrow">Smile quiz</p><h1>Find the right treatment.</h1><p>Five questions, one minute. This isn't a diagnosis, it's a starting point for your consultation.</p></div></section>
<section class="sec" style="padding-top:34px"><div class="wrap" style="max-width:820px"><div id="quiz"></div></div></section>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
LD.layout("smile-quiz.html");
const { $, esc, inr, img, D } = LD;
const Q = [
	{ q: "What would you most like to change?", o: [["Whiter teeth", { whitening: 3, veneers: 1 }], ["Straighter teeth", { aligners: 3, braces: 2 }], ["Fix a chipped or gappy tooth", { veneers: 3, filling: 1, crown: 1 }], ["I'm missing a tooth", { implant: 3, crown: 2 }], ["Nothing, just a check-up", { checkup: 3, cleaning: 2 }]] },
	{ q: "Are you in any pain right now?", o: [["Yes, a toothache", { rootcanal: 3, filling: 2 }], ["Sensitivity to hot / cold", { filling: 2, checkup: 2, cleaning: 1 }], ["Bleeding gums", { cleaning: 3, checkup: 1 }], ["No pain", { checkup: 1 }]] },
	{ q: "When did you last see a dentist?", o: [["Within 6 months", { cleaning: 1 }], ["6–12 months ago", { checkup: 2, cleaning: 2 }], ["Over a year ago", { checkup: 3, cleaning: 2 }], ["I can't remember", { checkup: 3, cleaning: 2, filling: 1 }]] },
	{ q: "Who is the treatment for?", o: [["Me (adult)", {}], ["My child", { kids: 5 }], ["A teenager", { braces: 2, aligners: 1, checkup: 1 }]] },
	{ q: "What matters most to you?", o: [["Looks / aesthetics", { veneers: 1, whitening: 1, aligners: 1 }], ["Speed, fewer visits", { whitening: 1, filling: 1 }], ["Long-term durability", { implant: 1, crown: 1 }], ["Lowest cost", { checkup: 1, cleaning: 1, filling: 1 }]] },
];
let i = 0, score = {};
function draw() {
	if (i >= Q.length) return result();
	const q = Q[i];
	$("#quiz").innerHTML = `<div class="steps">${Q.map((_, k) => `<span class="${k === i ? "on" : k < i ? "ok" : ""}">${k + 1}</span>`).join("")}</div><div class="panel"><h2 style="font-size:1.6rem;margin-bottom:16px">${q.q}</h2><div class="opts" style="grid-template-columns:1fr">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><b>${o[0]}</b></button>`).join("")}</div>${i ? '<button class="btn ghost sm" style="margin-top:16px" id="bk">← Back</button>' : ""}</div>`;
}
function result() {
	const top = Object.entries(score).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => LD.svc(id)); if (!top.length) top.push(LD.svc("checkup"));
	$("#quiz").innerHTML = `<div class="panel mint"><p class="eyebrow">Your result</p><h2 style="font-size:1.9rem;margin:6px 0 8px">We'd suggest starting with ${esc(top[0].name.toLowerCase())}.</h2><p class="msg">Based on your answers, these treatments are worth discussing at your consultation:</p></div>
	${top.map((s, k) => `<a class="card" href="service.html?s=${s.id}" style="flex-direction:row;margin-bottom:14px"><div class="ph" style="width:160px;aspect-ratio:auto;flex:none"><img src="${img(s.img)}" alt="" style="height:100%"></div><div class="bd"><span class="chip" style="align-self:flex-start">${k ? "Also consider" : "Best match"}</span><h3>${esc(s.name)}</h3><p>${esc(s.short)}</p><b>${inr(s.from)} – ${inr(s.to)}</b></div></a>`).join("")}
	<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><a class="btn" href="book.html?s=${top[0].id}">Book ${esc(top[0].name)}</a><a class="btn ghost" href="financing.html?s=${top.map((s) => s.id).join(",")}">Estimate cost &amp; EMI</a><button class="btn ghost" id="again">Retake quiz</button></div>`;
	$("#again").onclick = () => { i = 0; score = {}; draw(); };
}
document.addEventListener("click", (e) => {
	const b = e.target.closest("button"); if (!b) return;
	if (b.dataset.k !== undefined) { const o = Q[i].o[+b.dataset.k][1]; Object.entries(o).forEach(([k, v]) => { score[k] = (score[k] || 0) + v; }); i++; draw(); }
	else if (b.id === "bk") { i = 0; score = {}; draw(); }
});
draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
