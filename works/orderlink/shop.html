<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Order on WhatsApp | OrderLink</title>
<meta name="theme-color" content="#1fa855" />
<link rel="stylesheet" href="../lib/app.css" />
<style>
body{background:#f4f6f4;padding-bottom:90px}.shop{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)}
.cover{height:170px;background-size:cover;background-position:center;position:relative}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.6))}
.hd{padding:0 18px 14px;margin-top:-54px;position:relative;z-index:2}.logo{width:76px;height:76px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hd h1{font-size:1.5rem;margin-top:10px}.hd p{color:#667}.st{display:inline-block;padding:2px 12px;border-radius:99px;font-size:.78rem;font-weight:800;margin-top:6px}.st.o{background:#dcfce7;color:#15803d}.st.c{background:#fee2e2;color:#b91c1c}
.ann{background:var(--acc);color:#fff;padding:10px 18px;font-weight:600;font-size:.9rem}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e8ece8;padding:10px 14px;display:flex;gap:8px;overflow-x:auto}.nav button{flex:none;border:1.5px solid #e1e6e1;background:#fff;border-radius:99px;padding:7px 16px;font-weight:700;font-size:.88rem;color:#334}.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.srch{padding:12px 14px 0}.cat-h{padding:18px 18px 6px;font-size:1.1rem}.it{display:grid;grid-template-columns:1fr 104px;gap:14px;padding:14px 18px;border-bottom:1px solid #eef1ee}.it.off{opacity:.5}.it h3{font-size:1rem;margin:2px 0}.it p{color:#667;font-size:.86rem;line-height:1.4}.it .pr{font-weight:800;margin-top:6px}
.vd{display:inline-block;width:14px;height:14px;border:1.5px solid #15803d;border-radius:3px;position:relative;vertical-align:middle;margin-right:6px}.vd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#15803d}.vd.n{border-color:#b91c1c}.vd.n::after{background:#b91c1c}
.ph{position:relative}.ph img,.ph .tile{width:104px;height:104px;border-radius:16px;object-fit:cover;display:grid;place-items:center;font:800 2rem system-ui;color:#fff;background:var(--acc)}.ph .ad{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:#fff;color:var(--acc);border:1.5px solid var(--acc);border-radius:10px;padding:5px 22px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.12);cursor:pointer}.ph .ad:disabled{color:#999;border-color:#ccc}
.st2{display:inline-flex;align-items:center;gap:12px;background:var(--acc);color:#fff;border-radius:10px;padding:3px}.st2 button{width:30px;height:28px;border:0;background:none;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer}.ph .st2{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(536px,calc(100% - 24px));background:var(--acc);color:#fff;border:0;border-radius:16px;padding:14px 20px;font:700 1rem system-ui;display:flex;justify-content:space-between;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}.sheet-bg.on{display:block}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px;z-index:50;transition:transform .3s}.sheet.on{transform:translate(-50%,0)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg label{cursor:pointer}.seg input{position:absolute;opacity:0}.seg span{display:block;text-align:center;padding:12px;border:2px solid #e1e6e1;border-radius:12px;font-weight:700}.seg input:checked+span{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,#fff)}
.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #e6eae6}.tot{display:flex;justify-content:space-between;padding:4px 0;color:#445}.tot.g{font-weight:800;font-size:1.15rem;color:#111;border-top:2px solid #111;margin-top:6px;padding-top:10px}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#25d366;color:#04230f;border:0;border-radius:14px;padding:15px;font:800 1.05rem system-ui;cursor:pointer;margin-top:14px;text-decoration:none}.wa:disabled{opacity:.5;cursor:not-allowed}
.foot{text-align:center;color:#99a;font-size:.78rem;padding:24px}
</style>
</head>
<body>
<div class="shop" id="shop"></div>
<div class="sheet-bg" id="bg"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<script src="../lib/ui.js"></script><script src="js/core.js"></script>
<script>
const { $, esc } = UI;
const shared = location.hash.indexOf("#s=") === 0 ? OL.dec(location.hash.slice(3)) : null, D = shared || OL.data;
if (!shared) OL.addView();
document.documentElement.style.setProperty("--acc", D.biz.color); document.title = D.biz.name + " | Order on WhatsApp";
let cart = {}, cat = "", q = "", mode = D.delivery.delivery ? "delivery" : "pickup";
const items = () => D.items.filter((i) => (!cat || i.cat === cat) && (!q || (i.name + i.desc).toLowerCase().includes(q.toLowerCase())));
const lines = () => D.items.filter((i) => cart[i.id]).map((i) => ({ id: i.id, name: i.name, price: i.price, qty: cart[i.id] }));
const sub = () => lines().reduce((a, l) => a + l.price * l.qty, 0), count = () => lines().reduce((a, l) => a + l.qty, 0);
const fee = () => (mode === "delivery" && sub() < D.delivery.free ? D.delivery.fee : 0);
function tile(i) { return i.img ? `<img src="${OL.imgSrc(i.img)}" alt="${esc(i.name)}" loading="lazy">` : `<div class="tile">${esc(i.name[0])}</div>`; }
function draw() {
	const open = OL.isOpen(D.biz), cats = D.cats.filter((c) => D.items.some((i) => i.cat === c));
	$("#shop").innerHTML = `<div class="cover" style="background-image:url(${OL.imgSrc(D.biz.cover)})"></div><div class="hd"><div class="logo">${esc(D.biz.name[0])}</div><h1>${esc(D.biz.name)}</h1><p>${esc(D.biz.tagline)}</p><span class="st ${open ? "o" : "c"}">${open ? "Open now · until " + OL.fmt12(D.biz.hours.close) : "Closed · opens " + OL.fmt12(D.biz.hours.open)}</span></div>${D.biz.ann ? `<div class="ann">${esc(D.biz.ann)}</div>` : ""}
	<div class="nav"><button class="${!cat ? "on" : ""}" data-c="">All</button>${cats.map((c) => `<button class="${cat === c ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="srch"><input class="in" id="q" placeholder="Search the menu…" value="${esc(q)}" aria-label="Search"></div>
	<div id="list">${(cat ? [cat] : cats).map((c) => { const l = items().filter((i) => i.cat === c); return l.length ? `<h2 class="cat-h">${esc(c)}</h2>${l.map(row).join("")}` : ""; }).join("") || '<p class="empty">Nothing matches your search.</p>'}</div><div class="foot">Powered by OrderLink · a concept build</div>`;
	bar();
}
const row = (i) => `<div class="it ${i.avail ? "" : "off"}"><div><span class="vd ${i.veg ? "" : "n"}"></span><h3 style="display:inline">${esc(i.name)}</h3><p style="margin-top:4px">${esc(i.desc)}</p><div class="pr">${OL.money(i.price)}</div></div><div class="ph">${tile(i)}${!i.avail ? '<button class="ad" disabled>Sold out</button>' : cart[i.id] ? `<div class="st2"><button data-m="-1" data-i="${i.id}" aria-label="Less">−</button><b>${cart[i.id]}</b><button data-m="1" data-i="${i.id}" aria-label="More">+</button></div>` : `<button class="ad" data-m="1" data-i="${i.id}">ADD</button>`}</div></div>`;
function bar() { let b = $("#cb"); if (!count()) { b && b.remove(); return; } if (!b) { b = document.createElement("button"); b.id = "cb"; b.className = "bar"; b.onclick = checkout; document.body.appendChild(b); } b.innerHTML = `<span>${count()} item${count() > 1 ? "s" : ""} · ${OL.money(sub())}</span><span>View order →</span>`; }
function checkout() {
	const o = D.delivery, ok = sub() >= (mode === "delivery" ? o.min : 0), t = sub() + fee();
	$("#sheet").innerHTML = `<div class="row sb"><h2 style="font-size:1.3rem">Your order</h2><button class="btn sm" id="sx">✕</button></div><div style="margin:12px 0">${lines().map((l) => `<div class="line"><span>${l.qty} × ${esc(l.name)}</span><b>${OL.money(l.price * l.qty)}</b></div>`).join("")}</div>
	<div class="seg" style="margin-bottom:12px">${o.delivery ? `<label><input type="radio" name="mode" value="delivery" ${mode === "delivery" ? "checked" : ""}><span>🛵 Delivery</span></label>` : ""}${o.pickup ? `<label><input type="radio" name="mode" value="pickup" ${mode === "pickup" ? "checked" : ""}><span>🏪 Pickup</span></label>` : ""}</div>
	<form id="cf" class="stack" style="gap:10px"><div class="row2"><input class="in" name="name" placeholder="Your name" required value="${esc(localStorage.getItem("ol-name") || "")}"><input class="in" name="phone" placeholder="Mobile" pattern="[0-9]{10}" required value="${esc(localStorage.getItem("ol-phone") || "")}"></div>${mode === "delivery" ? `<textarea class="in" name="addr" rows="2" placeholder="Delivery address (${esc(o.areas)})" required>${esc(localStorage.getItem("ol-addr") || "")}</textarea>` : `<div class="note">Pick up from ${esc(D.biz.address)}</div>`}<select class="in" name="slot"><option>ASAP</option><option>Today evening</option><option>Tomorrow morning</option><option>Tomorrow evening</option></select><input class="in" name="note" placeholder="Special instructions (optional)">
	<div><div class="tot"><span>Subtotal</span><span>${OL.money(sub())}</span></div>${mode === "delivery" ? `<div class="tot"><span>Delivery</span><span>${fee() ? OL.money(fee()) : "Free"}</span></div>` : ""}<div class="tot g"><span>Total</span><span>${OL.money(t)}</span></div></div>
	<div class="seg">${D.pay.upi ? `<label><input type="radio" name="pay" value="UPI" checked><span>UPI</span></label>` : ""}${D.pay.cod ? `<label><input type="radio" name="pay" value="${mode === "delivery" ? "COD" : "Pay at store"}" ${D.pay.upi ? "" : "checked"}><span>${mode === "delivery" ? "Cash on delivery" : "Pay at store"}</span></label>` : ""}</div>
	${!ok ? `<p class="msg err" style="font-weight:700;color:#b91c1c">Minimum order for delivery is ${OL.money(o.min)}. Add ${OL.money(o.min - sub())} more or choose pickup.</p>` : ""}<button class="wa" ${ok ? "" : "disabled"}><svg width="22" height="22" viewBox="0 0 24 24" fill="#04230f"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6c-.2.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.2 1.4z"/></svg>Send order on WhatsApp</button></form>`;
	$("#sheet").classList.add("on"); $("#bg").classList.add("on");
	$("#sheet").onchange = (e) => { if (e.target.name === "mode") { mode = e.target.value; checkout(); } };
	$("#sx").onclick = closeSheet;
	$("#cf").onsubmit = (e) => { e.preventDefault(); const f = e.target; localStorage.setItem("ol-name", f.name.value); localStorage.setItem("ol-phone", f.phone.value); if (f.addr) localStorage.setItem("ol-addr", f.addr.value);
		const ords = OL.orders(), ref = "OL-" + (7000 + ords.length + 1), order = { id: ref, ts: Date.now(), name: f.name.value, phone: f.phone.value, mode, addr: f.addr ? f.addr.value : "", slot: f.slot.value + (f.note.value ? " · " + f.note.value : ""), items: lines(), sub: sub(), fee: fee(), total: t, pay: f.pay.value, status: "new", store: D.biz.name }; ords.unshift(order); OL.saveOrders(ords);
		const link = OL.waLink(D.biz.phone, OL.orderMsg(D, order)); window.open(link, "_blank", "noopener");
		$("#sheet").innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:3rem">✅</div><h2>Order ${ref} sent</h2><p class="mut" style="margin:8px 0 16px">WhatsApp should have opened with your order pre-filled. Just press send, ${esc(D.biz.name)} will confirm shortly.</p><a class="wa" href="${link}" target="_blank" rel="noopener">Open WhatsApp again</a><button class="btn" style="margin-top:10px" id="nw">Start a new order</button></div>`; cart = {}; draw(); $("#nw").onclick = closeSheet; };
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#bg").classList.remove("on"); }
$("#bg").onclick = closeSheet;
document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.c !== undefined) { cat = b.dataset.c; draw(); } else if (b.dataset.m) { const id = b.dataset.i; cart[id] = Math.max(0, (cart[id] || 0) + +b.dataset.m); if (!cart[id]) delete cart[id]; draw(); } });
document.addEventListener("input", (e) => { if (e.target.id === "q") { q = e.target.value; const p = e.target.selectionStart; draw(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
