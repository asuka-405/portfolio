<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self check-in kiosk | QueueLite (demo)</title>
<meta name="robots" content="noindex" />
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font:18px/1.45 system-ui,sans-serif;background:linear-gradient(160deg,#f3f1fb,#e4defb);color:#1c1440;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}header b{font-size:1.4rem}header a{color:#6c47ff;font-weight:700;text-decoration:none;font-size:.9rem}
.wrap{width:100%;max-width:980px}h1{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:8px;letter-spacing:-.02em}p.sub{color:#5a5380;margin-bottom:26px}
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.svc{background:#fff;border:3px solid transparent;border-radius:26px;padding:30px 26px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:0 10px 30px rgba(60,40,140,.1);transition:.15s}.svc:hover,.svc:active{transform:translateY(-3px);border-color:var(--c)}.svc i{display:block;width:54px;height:54px;border-radius:16px;background:var(--c);margin-bottom:14px}.svc b{display:block;font-size:1.35rem}.svc span{color:#5a5380;font-size:.95rem}
.card{background:#fff;border-radius:26px;padding:34px;box-shadow:0 10px 30px rgba(60,40,140,.1)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:16px auto}.pad button{padding:16px;font:700 1.5rem system-ui;border:0;border-radius:14px;background:#efeafc;cursor:pointer}.pad button:active{background:#d9d0f7}
.ph{font:800 2rem ui-monospace,monospace;text-align:center;letter-spacing:.12em;min-height:48px;border-bottom:3px solid #6c47ff}
.btn{display:inline-block;background:#6c47ff;color:#fff;border:0;border-radius:16px;padding:16px 32px;font:700 1.1rem system-ui;cursor:pointer;text-decoration:none}.btn.ghost{background:#efeafc;color:#4a2fd1}
.ticket{max-width:380px;margin:0 auto;background:#fff;border-radius:26px;padding:30px;text-align:center;box-shadow:0 20px 50px rgba(60,40,140,.2);border-top:12px solid var(--c)}.ticket .no{font:900 5.5rem/1 ui-monospace,Menlo,monospace;margin:6px 0}.ticket small{letter-spacing:.2em;text-transform:uppercase;color:#7a72a8;font-weight:700}
.ticket .qr{display:grid;place-items:center;margin:14px 0}.dash{border-top:2px dashed #cfc7ee;margin:16px -10px}
.hide{display:none!important}
@media print{body{background:#fff}header,.noprint,.sk-pill{display:none!important}.ticket{box-shadow:none;max-width:none}}
</style>
</head>
<body>
<header><b id="biz">Clinic</b><a href="desk.html" class="noprint">← Staff console</a></header>
<div class="wrap" id="app"></div>
<script src="../lib/ui.js"></script><script src="js/core.js"></script><script src="../lib/qrcode.min.js"></script>
<script>
const { $, esc } = UI; $("#biz").textContent = QL.state.settings.biz; let step = "pick", svc = null, ph = "", tk = null, timer = null;
function draw() {
	clearTimeout(timer);
	if (step === "pick") $("#app").innerHTML = `<h1>Welcome. How can we help?</h1><p class="sub">Tap a service to get your token, no need to queue at the desk.</p><div class="svcs">${QL.state.services.map((s) => `<button class="svc" style="--c:${s.color}" data-s="${s.id}"><i></i><b>${esc(s.name)}</b><span>${QL.waiting(s.id).length} waiting · about ${QL.estNew(s.id)} min</span></button>`).join("")}</div>`;
	else if (step === "phone") $("#app").innerHTML = `<div class="card" style="max-width:520px;margin:0 auto;text-align:center"><h1 style="font-size:2rem">${esc(svc.name)}</h1><p class="sub" style="margin-bottom:10px">Enter your mobile for a free SMS when you're nearly up (optional).</p><div class="ph" id="phn">${ph || "&nbsp;"}</div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "⌫", 0, "✓"].map((k) => `<button data-k="${k}">${k}</button>`).join("")}</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn ghost" data-back>← Back</button><button class="btn" data-print>${ph.length === 10 ? "Get my token" : "Skip & get token"}</button></div></div>`;
	else { const w = QL.estWait(tk), s = QL.svc(tk.svc); $("#app").innerHTML = `<div class="ticket" style="--c:${s.color}"><small>${esc(QL.state.settings.biz)}</small><div class="dash"></div><small>Your token</small><div class="no">${tk.no}</div><b style="font-size:1.3rem">${esc(s.name)}</b><div style="color:#5a5380;margin-top:6px">${QL.position(tk)} in line · about <b>${w} min</b></div><div class="qr" id="qr"></div><small>Scan to track on your phone</small><div class="dash"></div><small>${new Date().toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" })}</small></div><div style="text-align:center;margin-top:20px" class="noprint"><button class="btn" onclick="window.print()">🖨 Print ticket</button> <button class="btn ghost" data-done>Done</button><p style="margin-top:10px;color:#7a72a8;font-size:.9rem">Returning to the start screen in <span id="cd">20</span>s</p></div>`; const url = new URL("track.html?t=" + tk.no, location.href).href; new QRCode($("#qr"), { text: url, width: 132, height: 132 }); let n = 20; (function tick() { const e = $("#cd"); if (!e) return; e.textContent = n; if (n-- <= 0) { step = "pick"; draw(); return; } timer = setTimeout(tick, 1000); })(); }
}
document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
	if (b.dataset.s) { svc = QL.svc(b.dataset.s); ph = ""; step = "phone"; draw(); } else if (b.dataset.k) { const k = b.dataset.k; if (k === "⌫") ph = ph.slice(0, -1); else if (k === "✓") { } else if (ph.length < 10) ph += k; $("#phn").innerHTML = ph || "&nbsp;"; document.querySelector("[data-print]").textContent = ph.length === 10 ? "Get my token" : "Skip & get token"; }
	else if (b.hasAttribute("data-back")) { step = "pick"; draw(); } else if (b.hasAttribute("data-print")) { tk = QL.issue({ svc: svc.id, phone: ph.length === 10 ? ph : "", name: "Kiosk guest", source: "kiosk" }); step = "ticket"; draw(); } else if (b.hasAttribute("data-done")) { step = "pick"; draw(); } });
QL.on(() => { if (step === "pick") draw(); }); draw();
</script>
<script src="../shared.js" defer></script>
</body>
</html>
